<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · LogiTrans Express</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-login">
    <main class="login">
        <section class="login__marca" aria-label="LogiTrans Express">
            <h1 class="marca__nombre">LogiTrans<br>Express</h1>
            <p class="marca__lema">Control de rutas, vehículos y viajes de carga en un solo lugar.</p>
            <div class="carretera" aria-hidden="true"><span></span></div>
        </section>

        <section class="login__panel">
            <form id="form-login" class="formulario" novalidate>
                <h2>Iniciar sesión</h2>
                <p class="formulario__ayuda">Usa tu usuario o tu correo corporativo.</p>

                <div id="aviso" class="aviso" role="alert" aria-live="polite" hidden></div>

                <label for="usuario">Usuario o correo</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" autofocus>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" autocomplete="current-password">

                <button type="submit" id="btn-ingresar" class="boton">Iniciar sesión</button>
            </form>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
