<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conductores · LogiTrans Express</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-panel cargando">
    <div id="barra"></div>

    <main class="contenido contenido--ancho">
        <div class="encabezado-modulo">
            <div>
                <h1>Conductores</h1>
                <p class="contenido__intro">Registro, búsqueda y estado de los conductores.</p>
            </div>
            <button type="button" id="btn-nuevo" class="boton">Nuevo conductor</button>
        </div>

        <form id="form-filtros" class="filtros">
            <div>
                <label for="f-documento">Documento</label>
                <input type="text" id="f-documento" inputmode="numeric">
            </div>
            <div>
                <label for="f-licencia">N.º de licencia</label>
                <input type="text" id="f-licencia">
            </div>
            <div>
                <label for="f-estado">Estado</label>
                <select id="f-estado">
                    <option value="">Todos</option>
                    <option value="disponible">Disponible</option>
                    <option value="en_ruta">En ruta</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>
            <div class="filtros__botones">
                <button type="submit" class="boton">Buscar</button>
                <button type="button" id="btn-limpiar" class="boton boton--secundario">Limpiar</button>
            </div>
        </form>

        <div id="aviso" class="aviso" role="alert" aria-live="polite" hidden></div>

        <div class="tabla-contenedor">
            <table id="tabla-conductores" class="tabla">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Documento</th>
                        <th>Teléfono</th>
                        <th>Licencia</th>
                        <th>Vence</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla"></tbody>
            </table>
            <p id="sin-resultados" class="sin-resultados" hidden>No hay conductores que coincidan con la búsqueda.</p>
        </div>
    </main>

    <dialog id="dialogo-conductor" class="dialogo">
        <form id="form-conductor" class="formulario formulario--dialogo" novalidate>
            <h2 id="titulo-dialogo">Nuevo conductor</h2>
            <input type="hidden" id="conductor-id">

            <div class="rejilla">
                <div>
                    <label for="nombres">Nombres</label>
                    <input type="text" id="nombres" maxlength="100">
                    <span class="campo-error" id="error-nombres"></span>
                </div>
                <div>
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" maxlength="100">
                    <span class="campo-error" id="error-apellidos"></span>
                </div>
                <div>
                    <label for="documento">Documento</label>
                    <input type="text" id="documento" inputmode="numeric" maxlength="20">
                    <span class="campo-error" id="error-documento"></span>
                </div>
                <div>
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" maxlength="16">
                    <span class="campo-error" id="error-telefono"></span>
                </div>
                <div class="rejilla__ancho">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" maxlength="150">
                    <span class="campo-error" id="error-correo"></span>
                </div>
                <div>
                    <label for="numero_licencia">N.º de licencia</label>
                    <input type="text" id="numero_licencia" maxlength="50">
                    <span class="campo-error" id="error-numero_licencia"></span>
                </div>
                <div>
                    <label for="categoria_licencia">Categoría</label>
                    <input type="text" id="categoria_licencia" maxlength="20" placeholder="C2">
                    <span class="campo-error" id="error-categoria_licencia"></span>
                </div>
                <div>
                    <label for="fecha_vencimiento_licencia">Vencimiento de la licencia</label>
                    <input type="date" id="fecha_vencimiento_licencia">
                    <span class="campo-error" id="error-fecha_vencimiento_licencia"></span>
                </div>
                <div>
                    <label for="estado">Estado</label>
                    <select id="estado">
                        <option value="disponible">Disponible</option>
                        <option value="en_ruta">En ruta</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                    <span class="campo-error" id="error-estado"></span>
                </div>
            </div>

            <div class="dialogo__botones">
                <button type="button" id="btn-cancelar" class="boton boton--secundario">Cancelar</button>
                <button type="submit" id="btn-guardar" class="boton">Guardar</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="js/controllers/ConductoresController.js"></script>
</body>
</html>
